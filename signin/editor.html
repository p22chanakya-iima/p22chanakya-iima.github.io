<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editor — Portfolio Admin</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>C</text></svg>">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin-overlay.css">
</head>
<body class="admin-mode">

  <!-- Admin Toolbar -->
  <header class="admin-toolbar">
    <span class="admin-toolbar__logo">CY Admin</span>
    <nav class="admin-toolbar__tabs" id="adminTabs">
      <button class="admin-toolbar__tab admin-toolbar__tab--active" data-page="home">Home</button>
      <button class="admin-toolbar__tab" data-page="about">About</button>
      <button class="admin-toolbar__tab" data-page="work">Work</button>
      <button class="admin-toolbar__tab" data-page="writing">Writing</button>
      <button class="admin-toolbar__tab" data-page="contact">Contact</button>
    </nav>
    <div class="admin-toolbar__actions">
      <span class="admin-toolbar__status" id="adminStatus">No changes</span>
      <button class="admin-btn admin-btn--save" id="saveBtn" disabled>Save &amp; Commit</button>
      <button class="admin-btn admin-btn--logout" id="logoutBtn" title="Logout">Logout</button>
    </div>
  </header>

  <!-- Main content area — renders actual site markup -->
  <main id="admin-content"></main>

  <!-- Footer (same as site) -->
  <footer class="footer" style="margin-top: var(--space-lg);">
    <div class="container">
      <p class="footer__text">&copy; 2026 Chanakya Yadav. Built with intention.</p>
    </div>
  </footer>

  <!-- Edit Modal -->
  <div class="admin-modal-overlay" id="adminModal">
    <div class="admin-modal">
      <div class="admin-modal__title" id="adminModalTitle"></div>
      <div id="adminModalBody"></div>
      <div class="admin-modal__actions">
        <button class="admin-btn admin-btn--cancel" onclick="closeModal()">Cancel</button>
        <button class="admin-btn admin-btn--save" id="adminModalSave">Save</button>
      </div>
    </div>
  </div>

  <!-- Commit Modal -->
  <div class="admin-modal-overlay" id="commitModal">
    <div class="admin-modal" style="max-width: 440px;">
      <div class="admin-modal__title">Commit Changes</div>
      <div class="admin-field">
        <label class="admin-field__label">Commit message</label>
        <input type="text" class="admin-commit-input" id="commitInput" placeholder="Describe your changes..." maxlength="200" autocomplete="off">
      </div>
      <div class="admin-commit-files" id="commitFiles"></div>
      <div class="admin-modal__actions">
        <button class="admin-btn admin-btn--cancel" onclick="document.getElementById('commitModal').classList.remove('show')">Cancel</button>
        <button class="admin-btn admin-btn--save" id="commitBtn">Commit</button>
      </div>
    </div>
  </div>

  <!-- Monaco Overlay for Blog Content -->
  <div class="admin-monaco-overlay" id="monacoOverlay">
    <div class="admin-monaco-toolbar">
      <div>
        <span class="admin-monaco-toolbar__title" id="monacoTitle">Edit Blog Post</span>
        <span class="admin-monaco-toolbar__path" id="monacoPath"></span>
      </div>
      <div style="display:flex;gap:8px">
        <button class="admin-btn admin-btn--cancel" id="monacoClose">Close</button>
      </div>
    </div>
    <div id="admin-monaco-container"></div>
  </div>

  <!-- Toast -->
  <div class="admin-toast" id="adminToast"></div>

  <!-- Loading -->
  <div class="admin-loading" id="adminLoading"><div class="admin-spinner"></div></div>

  <!-- Monaco Editor CDN -->
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>
  <script src="../js/admin-editor.js"></script>
</body>
</html>
